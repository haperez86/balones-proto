ollapse;min-width:540px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf1f5;font-size:12px;white-space:nowrap}th{color:var(--muted);background:#fafbfd}.pill{background:#e7f5ed;color:#16734f;padding:5px 8px;border-radius:20px;font-size:10px}.low{background:#fff1e8;color:#b45309}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;min-width:0;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white;font:inherit}.full{grid-column:1/-1}.actions{margin-top:14px}.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:11px 0;font-size:13px}

/* Ajustes adicionales para pantallas pequeñas */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.app,main,.content,.page,.panel,.card{min-width:0;max-width:100%}
@media(max-width:700px){
  .app{display:flex;flex-direction:column;width:100%;overflow-x:hidden}
  .side{width:100%;max-width:100%;padding:14px 12px}
  .nav{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;white-space:nowrap}
  .nav button{flex:0 0 auto}

  }

.nav-icon{display:none}

<script>
/* ================== Utilidades ================== */
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDate(new Date());
const dayOf=iso=>isoDate(new Date(iso));
const fmtDT=iso=>new Date(iso).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
const normRef=r=>String(r||'').trim().toUpperCase();
const LS=(()=>{try{return window.localStorage}catch(e){return null}})(),SS=(()=>{try{return window.sessionStorage}catch(e){return null}})();
const sget=(s,k)=>{try{return s&&s.getItem(k)}catch(e){return null}},sset=(s,k,v)=>{try{s&&s.setItem(k,v)}catch(e){}};
const STORE_KEY='proto-inventario-v2';
const PAGES={dashboard:'Resumen general',products:'Productos e inventario',pos:'Punto de venta',cash:'Caja',arqueo:'Arqueo y cierre',movements:'Movimientos de inventario',reports:'Informes',users:'Usuarios y perfiles'};
const ROLE_PAGES={admin:Object.keys(PAGES),seller:['dashboard','pos']};
const denominations=[100000,50000,20000,10000,5000,2000,1000,500,200,100,50];
const IN_TYPES=['Entrada de producción','Compra a proveedor','Devolución de cliente','Ajuste positivo'];
const OUT_TYPES=['Producto dañado','Pérdida o robo','Ajuste negativo','Muestra / consumo interno'];

let db=null,page='dashboard',cart=[],posUI={q:'',cat:'Todas'},camStream=null,camTimer=null,importPlan=null;
let activeRole=sget(SS,'proto-role')||'admin',activeSeller=sget(SS,'proto-seller')||'';
const ui={products:{q:'',cat:'Todas',state:'Todos'},moves:{product:'Todos',dir:'Todas',from:'',to:''},reports:{from:'',to:''}};

/* ================== Estado ================== */
function seed(){
 const now=new Date(),y=now.getFullYear(),m=now.getMonth();
 const at=(dOffset,h,mi)=>{const d=new Date();d.setDate(d.getDate()+dOffset);d.setHours(h,mi,0,0);return d.toISOString()};
 const P=(id,name,ref,cat,price,stock,min,barcode='')=>({id,name,ref,cat,price,stock,min,barcode,active:true});
 const products=[P(1,'Balón fútbol #5','FUT-05','Fútbol',70000,92,15,'7701234000015'),P(2,'Balón fútbol #4','FUT-04','Fútbol',65000,30,10,'7701234000022'),P(3,'Balón fútbol #3','FUT-03','Fútbol',55000,14,5),P(4,'Balón microfútbol','MIC-04','Microfútbol',65000,55,10,'7701234000039'),P(5,'Balón baloncesto #7','BAS-07','Baloncesto',80000,37,8),P(6,'Balón baloncesto #5','BAS-05','Baloncesto',70000,6,8),P(7,'Balón voleibol','VOL-05','Voleibol',60000,48,8),P(8,'Balón voleibol playa','VOP-05','Voleibol',75000,0,5)];
 const it=(pid,qty)=>{const p=products.find(x=>x.id===pid);return {product:pid,name:p.name,ref:p.ref,qty,price:p.price}};
 let n=1;const S=(createdAt,items,payment,seller,extra={})=>{const total=items.reduce((s,i)=>s+i.qty*i.price,0);return {no:'PS-'+String(n++).padStart(6,'0'),createdAt,items,total,payment,seller,customer:{},approval:'',received:payment==='Efectivo'?total:null,change:0,cashSession:null,status:'Activa',...extra}};
 const sales=[
  S(at(-35,11,10),[it(1,4),it(7,2)],'Efectivo','Carlos'),
  S(at(-33,16,40),[it(5,3)],'Transferencia','Diana'),
  S(at(-9,10,5),[it(1,6),it(4,2)],'Datáfono','Carlos',{approval:'553201'}),
  S(at(-6,15,20),[it(2,3),it(3,2)],'Efectivo','Diana'),
  S(at(-4,12,0),[it(4,5)],'Transferencia','Carlos'),
  S(at(-2,17,45),[it(5,2),it(6,1)],'Efectivo','Diana'),
  S(at(-1,11,30),[it(7,3)],'Efectivo','Carlos',{status:'Anulada',voidReason:'Cliente desistió de la compra',voidedAt:at(-1,11,45)}),
  S(at(0,9,15),[it(1,8)],'Efectivo','Carlos'),
  S(at(0,10,2),[it(4,5)],'Transferencia','Diana'),

const IMPORT_HEADERS={name:['nombre','producto','descripcion','name'],ref:['referencia','ref','sku','codigo','code'],cat:['categoria','category','linea'],price:['precio','precio unitario','valor','price'],qty:['cantidad','stock','existencias','inventario','unidades','qty'],min:['minimo','stock minimo','min']};
function importPanelHTML(){return `<div class="panel" id="importPanel"><div class="heading"><div><h3 style="margin:0 0 6px">Importación masiva</h3><div class="sub">Carga muchas referencias a la vez desde un archivo CSV o pegando celdas copiadas de Excel.</div></div><button class="btn secondary" onclick="downloadImportTemplate()">Descargar plantilla</button></div><div class="notice">Columnas: <b>nombre</b>, <b>referencia</b>, <b>categoria</b>, <b>precio</b>, <b>cantidad</b> y <b>minimo</b>. Son obligatorias referencia y cantidad, y nombre/categoría para productos nuevos. Si la referencia existe, se actualiza; si no, se crea.</div><div class="formgrid"><div class="field"><label>Archivo CSV</label><input id="importFile" type="file" accept=".csv,.txt,text/csv"></div><div class="field"><label>Si la referencia ya existe</label><select id="importMode" onchange="if(importPlan)previewImport()"><option value="add">Sumar a existencias (entrada)</option><option value="replace">Reemplazar existencias (ajuste)</option></select></div><div class="field full"><label>O pega aquí los datos</label><textarea id="importText" rows="5" placeholder="nombre;referencia;categoria;precio;cantidad;minimo&#10;Balón fútbol #4;FUT-04;Fútbol;65000;30;10"></textarea></div></div><div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="previewImport()">Validar datos</button><button class="btn secondary" onclick="resetImport()">Limpiar</button></div><div id="importResult" class="hidden" style="margin-top:16px"><div id="importSummary" class="notice"></div><div class="tablewrap"><table><thead><tr><th>Fila</th><th>Referencia</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Cantidad</th><th>Acción</th><th>Detalle</th></tr></thead><tbody id="importRows"></tbody></table></div><div class="actions"><button class="btn" id="importConfirm" onclick="confirmImport()">Confirmar importación</button></div></div></div>`}
const normHeader=h=>String(h||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
function detectDelimiter(line){const c={'\t':0,';':0,',':0};let q=false;for(const ch of line){if(ch==='"')q=!q;else if(!q&&ch in c)c[ch]++}return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]}
function parseDelimited(text,d){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!==''))}
function parseMoney(v){const s=String(v??'').replace(/[$\s]|COP/gi,'');if(!s)return null;if(/^\d{1,3}([.,]\d{3})+$/.test(s))return +s.replace(/[.,]/g,'');if(/^\d+([.,]\d{1,2})?$/.test(s))return Math.round(+s.replace(',','.'));return NaN}

function buildImportPlan(text){const clean=text.replace(/^﻿/,'').trim();if(!clean)return {error:'No hay datos para importar.'};
 const rows=parseDelimited(clean,detectDelimiter(clean.split(/\r?\n/)[0])),header=rows.shift().map(normHeader),col={};for(const k in IMPORT_HEADERS)col[k]=header.findIndex(h=>IMPORT_HEADERS[k].includes(h));
 const missing=['ref','qty'].filter(k=>col[k]<0).map(k=>IMPORT_HEADERS[k][0]);if(missing.length)return {error:'Faltan columnas obligatorias: '+missing.join(', ')+'. Descarga la plantilla para ver el formato.'};

 const mode=$('importMode').value,seen=new Map(),items=[];
 rows.forEach((r,i)=>{const line=i+2,get=k=>col[k]>=0?String(r[col[k]]??'').trim():'';const name=get('name'),ref=get('ref'),cat=get('cat'),price=parseMoney(get('price')),qty=parseInt0(get('qty')),min=parseInt0(get('min'));const key=normRef(ref),ex=db.products.find(p=>normRef(p.ref)===key),errors=[];
  if(!ref)errors.push('Referencia vacía');else if(seen.has(key))errors.push('Referencia repetida (fila '+seen.get(key)+')');if(ref&&!seen.has(key))seen.set(key,line);
  if(!ex&&!name)errors.push('Nombre obligatorio para productos nuevos');if(!ex&&!cat)errors.push('Categoría obligatoria para productos nuevos');if(!ex&&!(price>0))errors.push('Precio obligatorio para productos nuevos');
  if(qty===null)errors.push('Cantidad vacía');else if(Number.isNaN(qty))errors.push('Cantidad no es un entero ≥ 0');if(Number.isNaN(price))errors.push('Precio inválido');if(Number.isNaN(min))errors.push('Mínimo inválido');

function renderImportPlan(){const {items,mode}=importPlan,ok=items.filter(i=>i.action!=='Error'),err=items.length-ok.length,created=ok.filter(i=>i.action==='Crear').length;

 $('importRows').innerHTML=items.map(i=>`<tr${i.action==='Error'?' style="background:#fff7ed"':''}><td>${i.line}</td><td>${esc(i.ref)}</td><td>${esc(i.name||i.ex?.name)}</td><td>${esc(i.cat||i.ex?.cat)}</td><td>${i.price===null||Number.isNaN(i.price)?'—':money(i.price)}</td><td>${i.qty===null||Number.isNaN(i.qty)?'—':i.qty}</td><td>${pill(i.action,i.action==='Error'?'low':'')}</td><td style="white-space:normal;min-width:180px">${esc(i.detail)}</td></tr>`).join('');

async function previewImport(){let text=$('importText').value;const file=$('importFile').files[0];if(file){if(file.size>2*1024*1024)return toast('El archivo supera 2 MB.','err');if(/\.xlsx?$/i.test(file.name))return toast('Este demo lee CSV. En Excel usa "Guardar como → CSV UTF-8" o pega las celdas en el cuadro de texto.','err');text=await file.text()}

 v.innerHTML=heading('Caja','Apertura, movimientos y resumen del turno.')+`<div class="cards"><div class="card"><div class="metric-label">Estado del turno</div><div class="metric">${c.open?'Abierta':c.closed?'Cerrada':'Sin apertura'}</div></div><div class="card"><div class="metric-label">Base inicial</div><div class="metric">${money(c.opening)}</div></div><div class="card"><div class="metric-label">Ventas del turno</div><div class="metric">${money(ss.reduce((a,s)=>a+s.total,0))}</div></div><div class="card"><div class="metric-label">Efectivo esperado</div><div class="metric">${money(cashExpected())}</div></div></div>
 <div class="two"><div class="panel"><h3>Apertura y movimientos</h3>${!c.open&&!c.closed?`<div class="field"><label>Base inicial de caja (COP)</label><input id="cashOpening" type="number" min="0" value="100000"></div><button class="btn" style="margin-top:12px" onclick="openCash()">Abrir caja</button>`:c.open?`<p class="muted">Abierta desde ${new Date(c.openedAt).toLocaleString('es-CO')}</p><button class="btn" onclick="cashMoveModal()">＋ Registrar entrada / salida</button>`:`<p class="muted">El turno está cerrado. Revisa el arqueo o abre un nuevo turno.</p><button class="btn" onclick="newCash()">Abrir nuevo turno</button>`}<h3 style="margin-top:18px">Movimientos de caja</h3>${c.movements.length?c.movements.map(m=>`<div class="line"><span><b>${m.type}:</b> ${esc(m.reason)}<br><small class="muted">${m.time}</small></span><b>${m.type==='Entrada'?'+':'−'}${money(m.amount)}</b></div>`).join(''):'<p class="muted">No hay movimientos registrados.</p>'}</div>
 <div class="panel"><h3>Resumen del turno</h3><div class="line"><span>Base inicial</span><b>${money(c.opening)}</b></div><div class="line"><span>Ventas en efectivo</span><b>${money(byPay(ss,'Efectivo'))}</b></div><div class="line"><span>Ventas por transferencia</span><b>${money(byPay(ss,'Transferencia'))}</b></div><div class="line"><span>Ventas por datáfono</span><b>${money(byPay(ss,'Datáfono'))}</b></div><div class="line"><span>Entradas de caja</span><b>${money(entries)}</b></div><div class="line"><span>Salidas de caja</span><b>${money(exits)}</b></div><div class="total-line"><span>Efectivo esperado</span><b>${money(cashExpected())}</b></div><p class="notice">Transferencias y datáfono se registran como ventas, pero no se suman al efectivo físico. Las ventas anuladas no cuentan.</p></div></div>`}
function openCash(){if(db.cash.open)return;const a=Number($('cashOpening').value);if(!Number.isFinite(a)||a<0||$('cashOpening').value==='')return toast('Ingresa una base inicial válida.','err');db.cash={open:true,closed:false,opening:a,openedAt:new Date().toISOString(),movements:[],count:{}};commit();toast('Caja abierta con base '+money(a)+'.')}
function newCash(){if(db.cash.open)return;db.cash={open:false,closed:false,opening:0,openedAt:null,movements:[],count:{}};commit()}
function cashMoveModal(){showModal(mhead('Movimiento de caja')+`<div class="formgrid"><div class="field"><label>Tipo</label><select id="cmType"><option>Entrada</option><option>Salida</option></select></div><div class="field"><label>Valor (COP) *</label><input id="cmAmount" type="number" min="1"></div><div class="field full"><label>Concepto *</label><input id="cmReason" maxlength="100" placeholder="Ej. pago de domicilio"></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveCashMove()">Guardar</button></div>`)}
function saveCashMove(){const amount=Number($('cmAmount').value),reason=$('cmReason').value.trim(),type=$('cmType').value;if(!(amount>0)||!reason)return toast('Completa el concepto y un valor válido.','err');if(type==='Salida'&&amount>cashExpected())return toast('La salida supera el efectivo esperado en caja.','err');db.cash.movements.push({type,reason,amount,time:new Date().toLocaleString('es-CO')});closeModal();commit()}

/* ================== Arqueo ================== */
function renderArqueo(v){const c=db.cash,exp=cashExpected(),cnt=cashCounted(),diff=cnt-exp,res=diff===0?'Cuadre exacto':diff<0?'Faltante':'Sobrante';
 v.innerHTML=heading('Arqueo y cierre de caja','Cuenta los billetes y monedas y verifica el resultado del turno.')+`<div class="cards"><div class="card"><div class="metric-label">Estado del turno</div><div class="metric">${c.open?'Abierto':c.closed?'Cerrado':'Sin apertura'}</div></div><div class="card"><div class="metric-label">Efectivo esperado</div><div class="metric">${money(exp)}</div></div><div class="card"><div class="metric-label">Efectivo contado</div><div class="metric">${money(cnt)}</div></div><div class="card"><div class="metric-label">Diferencia</div><div class="metric ${diff<0?'txt-red':diff>0?'txt-amber':''}">${money(diff)}</div></div></div>
 <div class="panel"><div class="heading"><div><h3>Conteo por denominación</h3><div class="sub">Cantidad de billetes y monedas que tienes físicamente.</div></div><button class="btn secondary" onclick="db.cash.count={};commit()">Limpiar conteo</button></div><div class="tablewrap"><table><thead><tr><th>Denominación</th><th>Cantidad</th><th>Subtotal</th></tr></thead><tbody>${denominations.map(d=>`<tr><td><b>${money(d)}</b></td><td><input type="number" min="0" step="1" inputmode="numeric" style="width:100px;padding:8px;border:1px solid #cbd5e1;border-radius:7px" value="${c.count[d]||''}" onchange="db.cash.count[${d}]=Math.max(0,Math.floor(Number(this.value)||0));commit()" placeholder="0" ${c.closed?'disabled':''}></td><td><b>${money(d*(Number(c.count[d])||0))}</b></td></tr>`).join('')}</tbody></table></div>
 <div class="two" style="margin-top:15px"><div class="panel"><div class="line"><span>Total contado</span><b>${money(cnt)}</b></div><div class="line"><span>Efectivo esperado</span><b>${money(exp)}</b></div><div class="line"><span>Diferencia</span><b>${money(diff)}</b></div><div class="line"><span>Resultado</span><b>${c.closed?c.result:res}</b></div></div><div class="panel"><h3>Cierre del turno</h3>${c.open?`<p class="muted">Realiza el cierre cuando termines de contar.</p><button class="btn" style="width:100%" onclick="closeCash()">Realizar cierre de caja</button>`:c.closed?`<p class="muted">Turno cerrado el ${new Date(c.closedAt).toLocaleString('es-CO')}.</p><button class="btn secondary" style="width:100%" onclick="newCash();show('cash')">Abrir nuevo turno</button>`:'<p class="muted">No hay una caja abierta.</p>'}</div></div></div>`}
function closeCash(){if(!db.cash.open)return;const cnt=cashCounted(),exp=cashExpected(),d=cnt-exp,res=d===0?'Cuadre exacto':d<0?'Faltante':'Sobrante';if(!confirm('¿Confirmas el cierre de caja?\nEfectivo esperado: '+money(exp)+'\nEfectivo contado: '+money(cnt)+'\nResultado: '+res+' ('+money(d)+')'))return;Object.assign(db.cash,{open:false,closed:true,closedAt:new Date().toISOString(),result:res+' ('+money(d)+')'});cart=[];commit();toast('Turno cerrado. '+res+': '+money(Math.abs(d))+'.')}

/* ================== Informes ================== */
function setRange(kind){const d=new Date();let from,to=today();if(kind==='hoy')from=today();else if(kind==='mes')from=today().slice(0,8)+'01';else{const p=new Date(d.getFullYear(),d.getMonth()-1,1),e=new Date(d.getFullYear(),d.getMonth(),0);from=isoDate(p);to=isoDate(e)}ui.reports={from,to};render()}
function renderReports(v){if(!ui.reports.from)ui.reports={from:today().slice(0,8)+'01',to:today()};const {from,to}=ui.reports,list=salesBetween(from,to),act=activeSales(list),top=topProducts(list),maxQ=top[0]?.qty||1,u=units(list),val=value(list),voided=list.filter(s=>s.status==='Anulada');
 const byCat={};act.forEach(s=>s.items.forEach(i=>{const c=product(i.product)?.cat||'Sin categoría';byCat[c]=(byCat[c]||0)+i.qty*i.price}));
 v.innerHTML=heading('Informes','Ventas, productos más vendidos y medios de pago por período.',`<div class="head-actions"><button class="btn secondary" onclick="downloadSales()">Exportar ventas (CSV)</button><button class="btn secondary" onclick="downloadInventory()">Exportar inventario</button></div>`)+
 `<div class="panel"><div class="toolbar rep-tb"><input type="date" value="${from}" aria-label="Desde" onchange="ui.reports.from=this.value;render()"><input type="date" value="${to}" aria-label="Hasta" onchange="ui.reports.to=this.value;render()"><div class="quick"><button class="tab" onclick="setRange('hoy')">Hoy</button><button class="tab" onclick="setRange('mes')">Este mes</button><button class="tab" onclick="setRange('anterior')">Mes anterior</button></div></div><p class="muted" style="margin:0">Del ${fmtD(from)} al ${fmtD(to)}</p></div>
 <div class="cards"><div class="card"><div class="metric-label">Ventas netas</div><div class="metric">${money(val)}</div></div><div class="card"><div class="metric-label">Unidades vendidas</div><div class="metric">${u}</div></div><div class="card"><div class="metric-label">Ventas (ticket promedio)</div><div class="metric">${act.length}</div><div class="muted">${money(act.length?val/act.length:0)} por venta</div></div><div class="card"><div class="metric-label">Anuladas</div><div class="metric ${voided.length?'txt-red':''}">${voided.length}</div><div class="muted">${money(voided.reduce((a,s)=>a+s.total,0))}</div></div></div>
 <div class="two"><div class="panel"><h3>Productos más vendidos</h3>${top.length?top.map((t,i)=>`<div class="rank-row"><span class="rank-n">${i+1}</span><div class="rank-main"><div class="rank-top"><b>${esc(t.name)}</b><span><b>${t.qty}</b> und · ${money(t.value)}</span></div><div class="bar"><span style="width:${Math.max(4,t.qty/maxQ*100)}%"></span></div><small class="muted">${esc(t.ref)} · ${Math.round(t.qty/u*100)}% de las unidades</small></div></div>`).join(''):'<p class="muted">Sin ventas en el período.</p>'}</div>
 <div class="panel"><h3>Por medio de pago</h3>${['Efectivo','Transferencia','Datáfono'].map(m=>`<div class="line"><span>${m}</span><b>${money(byPay(act,m))}</b></div>`).join('')}<h3 style="margin-top:18px">Por categoría</h3>${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="line"><span>${esc(c)}</span><b>${money(n)}</b></div>`).join(''):'<p class="muted">Sin ventas.</p>'}</div></div>
 <div class="panel"><h3>Detalle de ventas</h3><div class="tablewrap"><table><thead><tr><th>Venta</th><th>Fecha</th><th>Vendedor</th><th>Productos</th><th>Pago</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>${salesRows(list.slice().reverse())}</tbody></table></div></div>`}
function downloadSales(){const {from,to}=ui.reports,rows=[['Venta','Fecha','Vendedor','Cliente','Medio de pago','Aprobación','Estado','Producto','Referencia','Cantidad','Precio unitario','Subtotal']];salesBetween(from,to).forEach(s=>s.items.forEach(i=>rows.push([s.no,new Date(s.createdAt).toLocaleString('es-CO'),s.seller,s.customer?.name||'',s.payment,s.approval||'',s.status,i.name,i.ref,i.qty,i.price,i.qty*i.price])));download('ventas_proto_'+from+'_'+to+'.csv',rows)}

/* ================== Usuarios ================== */
function renderUsers(v){v.innerHTML=heading('Usuarios y perfiles','Equipo del almacén y permisos por perfil.',`<button class="btn" onclick="userModal()">＋ Crear usuario</button>`)+
 `<div class="two"><div class="panel"><h3>Administrador</h3><p class="muted">Productos, inventario, importación, movimientos, caja, arqueo, anulaciones, informes y usuarios.</p></div><div class="panel"><h3>Vendedor</h3><p class="muted">Inicio y punto de venta: busca o escanea productos y registra ventas con la caja abierta.</p></div></div>
 <div class="panel"><h3>Usuarios</h3><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Perfil</th><th>Ventas hoy</th><th>Estado</th><th></th></tr></thead><tbody>${db.users.map(u=>{const short=u.name.split(' ')[0],st=activeSales(salesBetween(today(),today())).filter(s=>s.seller===short);return `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.role)}</td><td>${u.role==='Vendedor'?st.length+' · '+money(st.reduce((a,s)=>a+s.total,0)):'—'}</td><td>${pill(u.active?'Activo':'Inactivo',u.active?'':'gray')}</td><td>${u.id===1?'':`<button class="btn small secondary" onclick="toggleUser(${u.id})">${u.active?'Desactivar':'Activar'}</button>`}</td></tr>`}).join('')}</tbody></table></div><p class="notice" style="margin-top:12px">El selector de perfil de la barra superior simula los permisos. La autenticación real requiere backend.</p></div>
 <div class="panel"><h3>Datos de la demo</h3><p class="muted">Los datos se guardan en este navegador. Puedes volver a los datos de ejemplo en cualquier momento.</p><button class="btn secondary" onclick="resetDemo()">↺ Restablecer datos de demo</button></div>`}
function userModal(){showModal(mhead('Crear usuario')+`<div class="formgrid"><div class="field full"><label>Nombre completo *</label><input id="uName" maxlength="60"></div><div class="field"><label>Perfil</label><select id="uRole"><option>Vendedor</option><option>Administrador</option></select></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveUser()">Crear</button></div>`)}
function saveUser(){const name=$('uName').value.trim();if(name.split(/\s+/).length<2)return toast('Ingresa nombre y apellido.','err');if(db.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return toast('Ese usuario ya existe.','err');if(db.users.some(u=>u.name.split(' ')[0].toLowerCase()===name.split(' ')[0].toLowerCase()))return toast('Ya hay un usuario con ese primer nombre; usa otro para distinguirlo en las ventas.','err');db.users.push({id:db.seq.user++,name,role:$('uRole').value,active:true});closeModal();refreshSellers();commit()}
function toggleUser(id){const u=db.users.find(x=>x.id===id);u.active=!u.active;refreshSellers();commit()}

/* ================== Inicio ================== */
db=loadState();saveState();
$('activeRole').value=activeRole;applyRole();

</script></body></html>
